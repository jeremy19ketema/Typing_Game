<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Game | Test Your Speed</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="home.html" class="logo">
                <i class="fas fa-keyboard"></i> TypingGame
            </a>
            <nav class="nav">
                <button class="mobile-menu-btn" aria-label="Open menu">
                    <i class="fas fa-bars"></i>
                </button>
                <ul class="nav-list">
                    <li><a href="game.html" class="nav-link active">Game</a></li>
                    <li><a href="about.html" class="nav-link">About</a></li>
                    <li><a href="stat.html" class="nav-link">Stats</a></li>
                    <li><a href="contact.html" class="nav-link">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>
        <main class="main">
        <div class="container">
            <section class="game-intro">
                <h1>Typing Speed Challenge</h1>
                <p>Test your typing speed and accuracy. Type the words below as quickly and accurately as possible!</p>
                <div class="game-info">
                    <div class="info-box">
                        <i class="fas fa-clock"></i>
                        <span>Time: <span id="timer">60</span>s</span>
                    </div>
                    <div class="info-box">
                        <i class="fas fa-bullseye"></i>
                        <span>Accuracy: <span id="accuracy">100</span>%</span>
                    </div>
                    <div class="info-box">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>WPM: <span id="wpm">0</span></span>
                    </div>
                </div>
            </section>
            <section class="player-setup" id="setup-section">
                <h2>Enter Your Name</h2>
                <form id="player-form">
                    <div class="form-group">
                        <label for="player-name">Player Name:</label>
                        <input type="text" id="player-name" placeholder="Enter your name" required minlength="2" maxlength="20">
                        <small class="error-msg" id="name-error"></small>
                    </div>
                    <div class="form-group">
                        <label for="difficulty">Difficulty:</label>
                        <select id="difficulty">
                            <option value="easy">Easy (Common Words)</option>
                            <option value="medium" selected>Medium (Mixed Words)</option>
                            <option value="hard">Hard (Long Words)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Start Game</button>
                </form>
            </section>
            <section class="game-area" id="game-area" style="display: none;">
                <div class="word-display">
                    <p id="current-word">Click Start to begin!</p>
                </div>
                
                <div class="input-area">
                    <input type="text" id="word-input" placeholder="Type the word here..." autocomplete="off" disabled>
                    <button id="start-btn" class="btn btn-success">Start Game</button>
                    <button id="reset-btn" class="btn btn-secondary">Reset</button>
                </div>
